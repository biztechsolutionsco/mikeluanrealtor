<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Page Not Found | Mike Luan Real Estate
    </title>

    <meta
        name="description"
        content="The page you are looking for could not be found. Return to the Mike Luan real estate website or continue exploring homes and communities."
    >

    <meta
        name="robots"
        content="noindex, follow"
    >

    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/service.css">

</head>

<body>

    <!-- ======================================================
         HEADER
    ======================================================= -->

    <div id="site-header"></div>

    <main>

        <!-- ======================================================
             404 HERO
        ======================================================= -->

        <section class="error-page">

            <div class="container error-page-content">
                <p class="section-eyebrow">
                    Error 404
                </p>
                <h1>
                    Page Not Found
                </h1>
                <p class="error-page-description">
                    The page you are looking for may have been moved,
                    renamed or no longer exists.
                </p>
                <div class="error-page-actions">
                    <a
                        href="./"
                        class="button button-primary"
                    >
                        Return Home
                    </a>
                    <a
                        href="./listings/"
                        class="button button-secondary"
                    >
                        Search Homes
                    </a>
                </div>

                <div class="error-page-links">
                    <p>
                        Or continue exploring:
                    </p>
                    <div class="error-page-link-list">
                        <a href="./buy/">
                            Buy
                        </a>
                        <a href="./sell/">
                            Sell
                        </a>
                        <a href="./communities/">
                            Communities
                        </a>
                        <a href="./contact.html">
                            Contact Mike
                        </a>
                    </div>
                </div>
            </div>

        </section>

    </main>

    <!-- ======================================================
         FOOTER
    ======================================================= -->

    <div id="site-footer"></div>

    <!-- ======================================================
         JAVASCRIPT
    ======================================================= -->

    <script src="./js/main.js"></script>

</body>

</html>
